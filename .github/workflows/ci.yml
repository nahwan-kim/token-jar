name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tokentank-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: macOS ${{ matrix.os }} (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the oldest supported image explicit.  Do not silently replace it
          # when GitHub changes the macOS-latest alias.
          - os: macos-14
            xcode: "16.2"
            developer_dir: /Applications/Xcode_16.2.app/Contents/Developer
          - os: macos-latest
            xcode: "runner-default-current"
            developer_dir: /Applications/Xcode.app/Contents/Developer
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      SWIFT_TOOLS_VERSION: "6.0"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select and print pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          printf 'DERIVED_DATA_PATH=%s/TokenTankDerivedData\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::Pinned Xcode directory is unavailable: $DEVELOPER_DIR"
            exit 1
          fi
          printf 'developer_dir=%s\n' "$DEVELOPER_DIR"
          /usr/bin/xcodebuild -version
          /usr/bin/xcrun swift --version
          printf 'swift_tools_version=%s\n' "$SWIFT_TOOLS_VERSION"

      - name: Validate Swift package manifest and graph
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/xcrun swift package --package-path Packages/TokenTankCore dump-package >/dev/null
          /usr/bin/xcrun swift package --package-path Packages/TokenTankCore resolve
          /usr/bin/xcrun swift package --package-path Packages/TokenTankCore show-dependencies

      - name: Run package tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/xcrun swift test --verbose --package-path Packages/TokenTankCore

      - name: Audit Provider source I/O boundary
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash Scripts/audit-provider-io.sh

      - name: Validate string catalog, plists, entitlements, and privacy manifest
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          import plistlib
          import re
          from pathlib import Path
          path = Path("TokenTankApp/Resources/Localizable.xcstrings")
          with path.open(encoding="utf-8") as stream:
              document = json.load(stream)
          if document.get("sourceLanguage") != "en" or not isinstance(document.get("strings"), dict):
              raise SystemExit("invalid string catalog root")
          print(f"validated {len(document['strings'])} localized keys")
          sources_path = Path("TokenTankApp/Distribution/ProviderSources.json")
          with sources_path.open(encoding="utf-8") as stream:
              sources = json.load(stream)
          entries = sources.get("providers")
          if not isinstance(entries, list):
              raise SystemExit("invalid ProviderSources providers list")
          expected = {"codex", "claude", "grok", "cursor", "doubao"}
          actual = {entry.get("provider") for entry in entries}
          if actual != expected or len(entries) != len(expected):
              raise SystemExit(f"invalid ProviderSources provider set: {sorted(actual)}")
          composed = {
              entry["provider"]
              for entry in entries
              if entry.get("productionComposition") is True
          }
          if composed != expected:
              raise SystemExit(f"unexpected production composition: {sorted(composed)}")
          statuses = {entry["provider"]: entry.get("sourceStatus") for entry in entries}
          expected_statuses = {
              "codex": "clear",
              "claude": "watch",
              "grok": "watch",
              "cursor": "watch",
              "doubao": "watch",
          }
          if statuses != expected_statuses:
              raise SystemExit(f"unexpected source statuses: {statuses}")
          print("validated five-provider source decisions and production composition")
          privacy = plistlib.loads(Path("TokenTankApp/Supporting/PrivacyInfo.xcprivacy").read_bytes())
          accessed_types = privacy.get("NSPrivacyAccessedAPITypes")
          expected_accessed_types = [
              {
                  "NSPrivacyAccessedAPIType": "NSPrivacyAccessedAPICategoryUserDefaults",
                  "NSPrivacyAccessedAPITypeReasons": ["CA92.1"],
              }
          ]
          if accessed_types != expected_accessed_types:
              raise SystemExit(f"unexpected privacy required-reason declarations: {accessed_types}")
          file_timestamp_api = re.compile(
              r"\b(?:stat|fstat|fstatat|lstat|getattrlist|getattrlistbulk|"
              r"fgetattrlist|getattrlistat)\s*\("
          )
          for root in [Path("Packages/TokenTankCore/Sources"), Path("TokenTankApp")]:
              for source in root.rglob("*.swift"):
                  if file_timestamp_api.search(source.read_text(encoding="utf-8")):
                      raise SystemExit(f"direct FileTimestamp required-reason API in {source}")
          print("validated privacy required-reason boundary")
          PY
          for plist in \
            TokenTankApp/Supporting/Info.plist \
            TokenTankApp/Supporting/PrivacyInfo.xcprivacy \
            TokenTankApp/Supporting/TokenTankApp.entitlements; do
            /usr/bin/plutil -lint "$plist"
          done

      - name: Build and run application unit and UI tests with local ad hoc signing
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/xcodebuild \
            -project TokenTank.xcodeproj \
            -scheme TokenTank \
            -configuration UITest \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            -destination 'platform=macOS' \
            test

      - name: Build unsigned universal Release candidate
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/xcodebuild \
            -project TokenTank.xcodeproj \
            -scheme TokenTank \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_CODE_COVERAGE=NO \
            CLANG_COVERAGE_MAPPING=NO \
            DEPLOYMENT_POSTPROCESSING=YES \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            -destination 'generic/platform=macOS' \
            build

      - name: Scan product and dependencies for forbidden payloads
        shell: bash
        run: |
          set -euo pipefail
          app="$DERIVED_DATA_PATH/Build/Products/Release/Token Jar.app"
          if [[ ! -d "$app" ]]; then
            echo "::error::Expected built product is missing: $app"
            exit 1
          fi
          [[ "$(/usr/bin/plutil -extract LSUIElement raw "$app/Contents/Info.plist")" == "true" ]] || {
            echo "::error::Release product is not menu-bar-only (LSUIElement=true required)."
            exit 1
          }
          /usr/bin/python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path("TokenTankApp/Supporting/TokenTankApp.entitlements")
          with path.open("rb") as stream:
              entitlements = plistlib.load(stream)
          if entitlements:
              raise SystemExit(f"release entitlements must remain empty, found: {sorted(entitlements)}")
          PY
          build_settings="$(/usr/bin/xcodebuild \
            -project TokenTank.xcodeproj \
            -target TokenTank \
            -configuration Release \
            -showBuildSettings)"
          for expected in \
            'ENABLE_HARDENED_RUNTIME = YES' \
            'CODE_SIGN_INJECT_BASE_ENTITLEMENTS = NO' \
            'ENABLE_CODE_COVERAGE = NO' \
            'DEAD_CODE_STRIPPING = YES' \
            'DEPLOYMENT_POSTPROCESSING = YES' \
            'STRIP_INSTALLED_PRODUCT = YES'; do
            if ! printf '%s\n' "$build_settings" | /usr/bin/grep -Fq "$expected"; then
              echo "::error::Missing Release build setting: $expected"
              exit 1
            fi
          done
          if printf '%s\n' "$build_settings" | /usr/bin/grep -Eq 'ENABLE_APP_SANDBOX = YES'; then
            echo "::error::App Sandbox must remain disabled for v1."
            exit 1
          fi

          /usr/bin/python3 - "$app" <<'PY'
          import hashlib
          import json
          import os
          import plistlib
          import re
          import subprocess
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])
          app_root = app.resolve(strict=True)
          binary = app / "Contents" / "MacOS" / "Token Jar"
          architectures = set(
              subprocess.check_output(["/usr/bin/lipo", "-archs", str(binary)], text=True).split()
          )
          if architectures != {"arm64", "x86_64"}:
              raise SystemExit(f"Release binary is not universal: {sorted(architectures)}")

          privacy = plistlib.loads(
              (app / "Contents" / "Resources" / "PrivacyInfo.xcprivacy").read_bytes()
          )
          expected_accessed_types = [
              {
                  "NSPrivacyAccessedAPIType": "NSPrivacyAccessedAPICategoryUserDefaults",
                  "NSPrivacyAccessedAPITypeReasons": ["CA92.1"],
              }
          ]
          if privacy.get("NSPrivacyAccessedAPITypes") != expected_accessed_types:
              raise SystemExit("exported privacy required-reason declarations changed")

          blocked_component = re.compile(
              r"WebKit|SafariServices|Safari|Browser|Chromium|Electron|CEF|Sparkle|"
              r"Squirrel|Updater|Update|Helpers|XPCServices|LoginItems|PrivilegedHelperTools",
              re.IGNORECASE,
          )
          forbidden_dependency = re.compile(
              r"WebKit|SafariServices|Chromium|Electron|Sparkle|Squirrel|WKWebView|"
              r"SUUpdater|Updater|UpdateAgent|UpdateKit|"
              r"(?:^|[^A-Za-z])(?:Safari|Browser|CEF)(?:$|[^A-Za-z])",
              re.IGNORECASE,
          )
          # Prose can describe a rejected browser path without linking a browser.
          # Keep generic names in dependency scans and standalone lookups.
          forbidden_string_reference = re.compile(
              r"WebKit|SafariServices|Chromium|Electron|Sparkle|Squirrel|WKWebView|"
              r"SUUpdater|Updater|UpdateAgent|UpdateKit|^(?:Safari|Browser|CEF)$",
              re.IGNORECASE | re.MULTILINE,
          )
          file_timestamp_import = re.compile(
              r"(?:^|\s)_?(?:stat|fstat|fstatat|lstat|getattrlist|getattrlistbulk|"
              r"fgetattrlist|getattrlistat)(?:$|\s)",
              re.MULTILINE,
          )
          test_markers = [
              b"ui-test-detail",
              b"ui-test.",
              b"Token Jar UI Test Detail",
              b"UITEST",
              b"TokenTankUITests",
              b"___profc_",
              b"___profd_",
              b"__llvm_profile",
              b"-profile-generate",
          ]
          secret_patterns = [
              re.compile(rb"sk-[A-Za-z0-9_-]{20,}"),
              re.compile(rb"sk-ant-[A-Za-z0-9_-]{20,}"),
              re.compile(rb"xai-[A-Za-z0-9_-]{20,}"),
              re.compile(rb"eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}"),
              re.compile(rb"AKIA[0-9A-Z]{16}"),
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          ]
          absolute_path_patterns = [
              re.compile(rb"/Users/[^/\x00]+/"),
              re.compile(rb"/home/[^/\x00]+/"),
              re.compile(rb"/private/var/folders/[^/\x00]+/"),
          ]
          macho_magics = {
              b"\xfe\xed\xfa\xce",
              b"\xce\xfa\xed\xfe",
              b"\xfe\xed\xfa\xcf",
              b"\xcf\xfa\xed\xfe",
              b"\xca\xfe\xba\xbe",
              b"\xbe\xba\xfe\xca",
              b"\xca\xfe\xba\xbf",
              b"\xbf\xba\xfe\xca",
          }

          macho_files = []
          for path in app.rglob("*"):
              relative = path.relative_to(app)
              is_blocked = (
                  blocked_component.fullmatch(path.name)
                  or blocked_component.fullmatch(path.stem)
                  or path.suffix.lower() in {".xpc", ".appex"}
              )
              if is_blocked:
                  raise SystemExit(f"forbidden browser, updater, or helper payload: {relative}")
              if path.is_symlink():
                  resolved = path.resolve(strict=True)
                  try:
                      resolved.relative_to(app_root)
                  except ValueError as error:
                      raise SystemExit(f"bundle symlink escapes the app: {relative}") from error
              if not path.is_file():
                  continue

              payload = path.read_bytes()
              leaked_markers = [marker.decode() for marker in test_markers if marker in payload]
              if leaked_markers:
                  raise SystemExit(f"test or profiling marker leaked into {relative}: {leaked_markers}")
              if any(pattern.search(payload) for pattern in absolute_path_patterns):
                  raise SystemExit(f"absolute build or user path leaked into {relative}")
              if any(pattern.search(payload) for pattern in secret_patterns):
                  raise SystemExit(f"credential-shaped value leaked into {relative}")
              if payload[:4] in macho_magics:
                  macho_files.append(path)

          if binary not in macho_files:
              raise SystemExit("main executable is missing or is not Mach-O")

          for macho in macho_files:
              dependencies = subprocess.check_output(
                  ["/usr/bin/otool", "-L", str(macho)],
                  text=True,
                  errors="replace",
              )
              symbols = subprocess.check_output(
                  ["/usr/bin/strings", "-a", str(macho)],
                  text=True,
                  errors="replace",
              )
              imports = subprocess.check_output(
                  ["/usr/bin/nm", "-u", str(macho)],
                  text=True,
                  errors="replace",
              )
              if file_timestamp_import.search(imports):
                  raise SystemExit(f"direct FileTimestamp API import in {macho.relative_to(app)}")
              if (
                  forbidden_dependency.search(dependencies)
                  or forbidden_string_reference.search(symbols)
              ):
                  raise SystemExit(f"forbidden browser or updater reference in {macho.relative_to(app)}")

          source_commit = os.environ.get("GITHUB_SHA", "")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", source_commit):
              raise SystemExit("GITHUB_SHA is missing or malformed")
          source_hash = os.environ.get("TOKENTANK_SOURCE_HASH", "")
          if source_hash and not re.fullmatch(r"sha256:[0-9a-f]{64}", source_hash):
              raise SystemExit("TOKENTANK_SOURCE_HASH is malformed")
          binary_payload = binary.read_bytes()
          receipt = {
              "schema": "tokentank.release-receipt.v2",
              "sourceCommit": source_commit.lower(),
              "binarySHA256": hashlib.sha256(binary_payload).hexdigest(),
              "binaryBytes": len(binary_payload),
              "architectures": sorted(architectures),
              "machOFilesScanned": len(macho_files),
              "bundleFilesScanned": sum(1 for path in app.rglob("*") if path.is_file()),
              "checks": {
                  "architectures": "passed",
                  "bundlePayload": "passed",
                  "dependenciesAndSymbols": "passed",
                  "entitlements": "passed",
                  "privacyManifestAndImports": "passed",
                  "releaseMarkerLeakage": "passed",
                  "secretAndPathLeakage": "passed",
                  "sourceProvenance": "passed",
              },
          }
          if source_hash:
              receipt["sourceHash"] = source_hash
          receipt_path = Path(os.environ["RUNNER_TEMP"]) / "tokentank-release-receipt.json"
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, sort_keys=True))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("### Token Jar Release receipt\n\n```json\n")
              summary.write(json.dumps(receipt, indent=2, sort_keys=True))
              summary.write("\n```\n")
          PY
          echo "Product dependency, leakage, and provenance scan passed."
